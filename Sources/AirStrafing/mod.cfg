[mod]
name = "AirStrafing"
version = "1.1.0"
author = "rekitrelt"
description = "added Air Strafing to the movement system

hold both opposite directions to stop velocity if braking is on"
game_version = "4.0.1"
config_editable = true

[dependencies]

[config]
accel_range = 0.5
speed = 0.5
braking = true

[config_min]
accel_range = 0.0
speed = 0.0

[config_max]
accel_range = 2.0
speed = 2.0

[config_step]
accel_range = 0.1
speed = 0.1
